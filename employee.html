<!DOCTYPE html>
<html>

<head>
    <title>Employee Leave Request</title>
</head>

<body>

    <h2>Employee Leave Request</h2>

    <form id="leaveForm">

        <label>Employee ID:</label>
        <input type="text" id="employee_id" required>

        <br><br>

        <label>Employee Name:</label>
        <input type="text" id="employee_name" required>

        <br><br>

        <label>Leave Type:</label>
        <input type="text" id="leave_type" required>

        <br><br>

        <button type="submit">Submit Leave Request</button>

    </form>

    <p id="result"></p>

    <script>

        document.getElementById("leaveForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const employeeData = {

                employee_id:
                document.getElementById("employee_id").value,

                employee_name:
                document.getElementById("employee_name").value,

                leave_type:
                document.getElementById("leave_type").value
            };

            const response = await fetch(
                "https://hzeps062qe.execute-api.ap-south-1.amazonaws.com/leave",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(employeeData)
                }
            );

            const result = await response.json();

            document.getElementById("result").innerHTML =
                result.message;

        });

    </script>

</body>

</html>
