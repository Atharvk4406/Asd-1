<!DOCTYPE html> 
<html> 
<head> 
    <title>Student Registration</title> 
</head> 
 
<body> 
 
    <h2>Student Registration Form</h2> 
 
    <form id="registrationForm"> 
 
        <label>Name:</label> 
        <input type="text" id="name" required> 
        <br><br> 
 
        <label>Roll Number:</label> 
        <input type="text" id="rollno" required> 
        <br><br> 
 
        <label>Branch:</label> 
        <input type="text" id="branch" required> 
        <br><br> 
 
        <button type="submit">Register</button> 
 
    </form> 
 
    <p id="result"></p> 
 
<script> 
 
document.getElementById("registrationForm") 
.addEventListener("submit", async function(event) { 
 
    event.preventDefault(); 
 
    const studentData = {         name: document.getElementById("name").value,         rollno: document.getElementById("rollno").value,         branch: document.getElementById("branch").value 
    }; 
 
    const response = await fetch( 
        "https://7kj2g7x3wk.execute-api.ap-south-1.amazonaws.com/register", 
        { 
            method: "POST", 
 
            headers: { 
                "Content-Type": "application/json" 
            }, 
 
            body: JSON.stringify(studentData) 
        } 
    ); 
 
    const result = await response.json(); 
 
    document.getElementById("result").innerHTML =         result.message; 
}); 
 
</script> 
 
</body>
